# Continuous integration for this repository, written by `dacli new`.
# It runs the two commands recorded in the project's Constraints section —
# `go build ./...` and `go test ./...` — so a red check here means what a red local run means.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Go build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Pin the toolchain to the version go.mod declares so CI is
          # deterministic (a floating 'stable' can drift under us) — the
          # project's determinism value applies to its own build too.
          go-version-file: 'go.mod'
          cache: 'false'
      - name: Download modules
        run: go mod download
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./...
