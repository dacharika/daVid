# Continuous integration.
#
# The gates here mirror what actually broke this project rather than a generic
# checklist: formatting and vet catch the mechanical mistakes, `-race` catches
# concurrent ones, a coverage floor stops the tested surface silently shrinking,
# and the worker contract job checks the Python side against the same JSON
# protocol the Go core speaks — a worker that stops honouring it fails no Go
# test at all.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Supersede ordinary runs, while explicit manual audits keep their own group.
  group: ci-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

env:
  # The floor is set just under where the suite stands, so it ratchets rather
  # than blocks: raise it when coverage rises, never lower it to go green.
  COVERAGE_FLOOR: "62"

jobs:
  go:
    name: Go ${{ matrix.os }}
    needs: staticcheck
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      # A failed PR needs no further matrix spend; manual audits run both legs.
      fail-fast: ${{ github.event_name == 'pull_request' }}
      matrix:
        # Ordinary CI uses Linux; native macOS validation runs locally and
        # remains available alongside Linux in an explicit manual audit.
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["ubuntu-latest","macos-latest"]' || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # Pinned to go.mod so CI cannot drift under us.
          go-version-file: 'go.mod'
          cache: true

      - name: Formatting
        run: |
          unformatted=$(gofmt -l . | grep -v '^$' || true)
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt'd:"
            echo "$unformatted"
            gofmt -d $unformatted
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test with race detector and coverage
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Verify canonical product identity
        run: ./scripts/check_branding.sh

      - name: Coverage floor
        shell: bash
        run: |
          pct=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}' | tr -d '%')
          echo "total coverage: ${pct}%  (floor ${COVERAGE_FLOOR}%)"
          awk -v p="$pct" -v f="$COVERAGE_FLOOR" 'BEGIN {exit !(p+0 < f+0)}' \
            && { echo "::error::coverage ${pct}% is below the ${COVERAGE_FLOOR}% floor"; exit 1; } || true

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          retention-days: 14

  staticcheck:
    name: Staticcheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STATICCHECK_VERSION: v0.7.0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        id: go
        with:
          go-version-file: 'go.mod'
          cache: true
      # Fail cheap formatting and workflow contracts before installing analysis
      # tooling or admitting the existing full Linux/macOS verification jobs.
      - name: Formatting preflight
        run: |
          unformatted=$(gofmt -l . | grep -v '^$' || true)
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt'd:"
            echo "$unformatted"
            gofmt -d $unformatted
            exit 1
          fi

      - name: Workflow regression contract
        run: go test ./.github/workflows
      # Staticcheck 2026.1 supports the module's Go 1.26 syntax. Cache the
      # executable separately: setup-go caches modules/builds, not GOPATH/bin.
      - uses: actions/cache@v4
        id: staticcheck-cache
        with:
          path: ${{ runner.temp }}/daVid-ci-tools
          key: staticcheck-${{ runner.os }}-${{ runner.arch }}-go${{ steps.go.outputs.go-version }}-${{ env.STATICCHECK_VERSION }}
      - name: Install staticcheck
        if: steps.staticcheck-cache.outputs.cache-hit != 'true'
        env:
          GOBIN: ${{ runner.temp }}/daVid-ci-tools
        run: go install "honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION}"
      - name: Verify pinned staticcheck
        shell: bash
        run: '"$RUNNER_TEMP/daVid-ci-tools/staticcheck" -version | grep -Fx "staticcheck 2026.1 (v0.7.0)"'
      - run: '"$RUNNER_TEMP/daVid-ci-tools/staticcheck" ./...'

  workers:
    name: Python workers
    needs: staticcheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install ruff
        run: pip install --quiet ruff
      - name: Lint
        run: ruff check workers/
      - name: Format check
        run: ruff format --check workers/
      - name: Compile every worker
        # A syntax error in a worker is invisible to the Go suite until a
        # pipeline run fails halfway through.
        run: python -m compileall -q workers/
      - name: Worker unit tests
        run: python -m unittest discover -s workers -p 'test_*.py'
      - name: Every worker entry point is executable
        # doctor tells an agent to point DAVID_*_WORKER at these files, and the
        # core exec()s that path directly. A worker committed 100644 therefore
        # dies with "permission denied" on a fresh clone even though the file is
        # right there with a #!/usr/bin/env python3 line promising otherwise —
        # a dead end in the primary onboarding path that no other check catches.
        # The rule: shebang + __main__ means entry point means mode 755. The two
        # library modules (cutvec_worker.py, embedder.py) have neither and stay 644.
        run: |
          status=0
          while read -r mode _ _ path; do
            case "$path" in *.py) ;; *) continue ;; esac
            head -1 "$path" | grep -q '^#!' || continue
            grep -q '__main__' "$path" || continue
            if [ "$mode" != "100755" ]; then
              echo "::error file=$path::worker entry point is mode $mode, want 100755 — run: git update-index --chmod=+x $path"
              status=1
            fi
          done <<< "$(git ls-files -s workers/)"
          exit $status

  contract:
    name: Worker protocol contract
    needs: staticcheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check the workers answer the contract the core speaks
        # Runs each worker with no ML dependencies installed: every one must
        # still return a well-formed JSON Response with a structured error
        # rather than a traceback, which is the promise the core relies on.
        run: go test -run TestWorkerContract -v ./cmd/daVid

  # The repository's ruleset requires a check with this exact name, and that
  # name predates the jobs above being split up. Rather than rename the rule,
  # this gate carries it: it passes only when every other job did, so the
  # required check now means "everything is green" instead of "the build ran".
  build:
    name: Go build and test
    needs: [go, staticcheck, workers, contract]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report the result of every job
        run: |
          echo "go:          ${{ needs.go.result }}"
          echo "staticcheck: ${{ needs.staticcheck.result }}"
          echo "workers:     ${{ needs.workers.result }}"
          echo "contract:    ${{ needs.contract.result }}"
          for r in "${{ needs.go.result }}" "${{ needs.staticcheck.result }}" \
                   "${{ needs.workers.result }}" "${{ needs.contract.result }}"; do
            if [ "$r" != "success" ]; then
              echo "::error::a required job did not succeed"
              exit 1
            fi
          done
