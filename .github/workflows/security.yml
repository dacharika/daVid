name: History security

on:
  workflow_dispatch:

permissions:
  contents: read

# Manual full-history audits are isolated from ordinary superseding runs.
concurrency:
  group: history-security-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  secrets:
    name: Full-history secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan every reachable commit
        run: >-
          docker run --rm -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854
          detect --source /repo --log-opts=--all --redact --no-banner
